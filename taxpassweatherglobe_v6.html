<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>World Explorer – Tax · Passport · Weather</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
:root{
  --bg:#fff;--bg2:#f5f5f5;--bg-info:#e3f2fd;
  --tx:#1a1a1a;--tx2:#666;--tx3:#999;--tx-info:#1976d2;
  --bd:#e0e0e0;--bd2:#ccc;--bd-info:#1976d2;
  --r:4px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;}
#wrap{position:relative;width:100%;height:100vh;background:var(--bg);overflow:hidden;font-family:var(--font);}

/* ── Mode bar (top centre) ── */
#mode-bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:25;
  display:flex;background:var(--bg2);border:0.5px solid var(--bd);border-radius:20px;overflow:hidden;}
.mode-btn{padding:7px 18px;font-size:12px;font-weight:600;border:none;cursor:pointer;
  background:transparent;color:var(--tx2);transition:all .15s;letter-spacing:.3px;}
.mode-btn.active{background:var(--bg-info);color:var(--tx-info);}

/* ── Side panel ── */
#side-panel{position:absolute;top:0;left:0;bottom:0;width:252px;z-index:15;
  display:flex;flex-direction:column;background:var(--bg);border-right:0.5px solid var(--bd);overflow:hidden;}
#map-area{position:absolute;left:252px;right:0;top:0;bottom:0;overflow:hidden;background:var(--bg);}
#map-svg{width:100%;height:100%;display:block;cursor:grab;}
#tooltip{position:absolute;display:none;background:var(--bg);border:0.5px solid var(--bd2);
  border-radius:var(--r);padding:10px 14px;font-size:12px;pointer-events:none;z-index:30;max-width:240px;}

/* ── Sub-switch (inside panel) ── */
#sub-bar{display:flex;border-bottom:0.5px solid var(--bd);flex-shrink:0;}
.sub-btn{flex:1;padding:6px 2px;font-size:10px;font-weight:500;border:none;cursor:pointer;
  background:transparent;color:var(--tx2);border-bottom:2px solid transparent;}
.sub-btn.active{color:var(--tx-info);border-bottom-color:var(--bd-info);background:var(--bg-info);}

/* ── Weather month slider ── */
#weather-ctrl{padding:8px 10px;border-bottom:0.5px solid var(--bd);flex-shrink:0;display:none;}
#weather-ctrl.visible{display:block;}
.month-slider-wrap{display:flex;align-items:center;gap:6px;margin-top:4px;}
#month-slider{flex:1;height:3px;accent-color:var(--tx-info);}
#month-label{font-size:11px;font-weight:600;color:var(--tx-info);min-width:28px;text-align:right;}
.wc-tabs{display:flex;gap:3px;margin-bottom:6px;}
.wc-tab{padding:3px 8px;font-size:10px;border:0.5px solid var(--bd2);border-radius:var(--r);
  background:transparent;color:var(--tx2);cursor:pointer;}
.wc-tab.active{background:var(--bg-info);color:var(--tx-info);border-color:var(--bd-info);}

/* ── Search ── */
#search-wrap{padding:8px;flex-shrink:0;}
#search-input{width:100%;padding:6px 9px;font-size:12px;border:0.5px solid var(--bd2);
  border-radius:var(--r);background:var(--bg);color:var(--tx);}

/* ── Filter ── */
#filter-section{padding:0 8px 6px;border-bottom:0.5px solid var(--bd);flex-shrink:0;}
.filter-label{font-size:10px;color:var(--tx2);margin:5px 0 3px;}
.range-row{display:flex;gap:4px;align-items:center;}
.range-row input[type=number]{width:48px;padding:3px 5px;font-size:11px;
  border:0.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--tx);}
.range-row span{font-size:11px;color:var(--tx3);}
#filter-toggle{width:100%;padding:5px;font-size:11px;font-weight:500;
  border:0.5px solid var(--bd2);border-radius:var(--r);background:transparent;color:var(--tx2);cursor:pointer;margin-top:4px;}
#filter-body{display:none;}
#filter-body.open{display:block;}

/* ── Sort ── */
#sort-bar{display:flex;gap:3px;padding:5px 8px;border-bottom:0.5px solid var(--bd);flex-wrap:wrap;flex-shrink:0;}
.sort-btn{padding:3px 6px;font-size:10px;border:0.5px solid var(--bd2);border-radius:var(--r);
  background:transparent;color:var(--tx2);cursor:pointer;}
.sort-btn.active{background:var(--bg-info);color:var(--tx-info);border-color:var(--bd-info);}

/* ── Results ── */
#result-count{padding:4px 10px;font-size:10px;color:var(--tx2);border-bottom:0.5px solid var(--bd);flex-shrink:0;}
#results-list{overflow-y:auto;flex:1;}
.res-item{padding:7px 10px;border-bottom:0.5px solid var(--bd);cursor:pointer;}
.res-item:hover{background:var(--bg2);}
.res-item.pinned{background:var(--bg-info);}
.res-name{font-size:12px;font-weight:500;color:var(--tx);margin-bottom:3px;}
.res-grid{display:grid;grid-template-columns:1fr auto;gap:1px 8px;font-size:10px;color:var(--tx2);}
.passport-rank{font-size:10px;color:var(--tx3);margin-top:2px;}
/* passport bar */
.visa-bar-wrap{margin-top:3px;height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;}
.visa-bar{height:4px;border-radius:2px;background:linear-gradient(90deg,#1976d2,#42a5f5);}
/* weather mini bars */
.w-month-bar{display:flex;gap:1px;margin-top:3px;height:18px;align-items:flex-end;}
.w-month-bar div{flex:1;min-height:1px;border-radius:1px;}

/* ── Zoom / controls ── */
#zoom-controls{position:absolute;bottom:44px;right:12px;z-index:10;display:flex;flex-direction:column;gap:4px;}
.zb{width:30px;height:30px;border:0.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);
  color:var(--tx);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#legend-wrap{position:absolute;bottom:14px;right:12px;display:flex;align-items:center;gap:6px;
  font-size:10px;color:var(--tx2);}
</style>
</head>
<body>
<div id="wrap">

<!-- TOP MODE BAR -->
<div id="mode-bar">
  <button class="mode-btn active" data-mode="tax">🏦 Steuern</button>
  <button class="mode-btn" data-mode="passport">🛂 Reisepass</button>
  <button class="mode-btn" data-mode="weather">☀️ Wetter</button>
</div>

<!-- SIDE PANEL -->
<div id="side-panel">
  <!-- sub-switches: tax mode -->
  <div id="sub-bar">
    <button class="sub-btn active" data-key="effective">Ø Effektiv</button>
    <button class="sub-btn" data-key="capital">Kapital</button>
    <button class="sub-btn" data-key="corporate">Körper.</button>
    <button class="sub-btn" data-key="income">Max.Eink.</button>
  </div>

  <!-- weather controls -->
  <div id="weather-ctrl">
    <div class="wc-tabs">
      <button class="wc-tab active" data-wkey="sun">☀ Sonne</button>
      <button class="wc-tab" data-wkey="rain">🌧 Regen</button>
      <button class="wc-tab" data-wkey="temp">🌡 Temp</button>
    </div>
    <div class="month-slider-wrap">
      <span style="font-size:10px;color:var(--tx2);">Monat:</span>
      <input id="month-slider" type="range" min="0" max="11" value="0"/>
      <span id="month-label">Jan</span>
    </div>
  </div>

  <div id="search-wrap">
    <input id="search-input" type="text" placeholder="Land suchen…" autocomplete="off"/>
  </div>

  <div id="filter-section">
    <button id="filter-toggle">▸ Filter</button>
    <div id="filter-body" id="filter-body">
      <!-- dynamically filled per mode -->
    </div>
  </div>

  <div id="sort-bar">
    <span style="font-size:10px;color:var(--tx2);align-self:center;">Sort:</span>
    <button class="sort-btn active" data-sort="primary-asc">↑</button>
    <button class="sort-btn" data-sort="primary-desc">↓</button>
    <button class="sort-btn" data-sort="name-asc">A–Z</button>
  </div>

  <div id="result-count"></div>
  <div id="results-list"></div>
</div>

<!-- MAP -->
<div id="map-area">
  <svg id="map-svg"></svg>
  <div id="tooltip"></div>
  <div id="zoom-controls">
    <button class="zb" id="zoom-in">+</button>
    <button class="zb" id="zoom-out">−</button>
    <button class="zb" id="zoom-reset" style="font-size:11px;">↺</button>
    <button class="zb" id="dark-toggle" style="font-size:11px;">◐</button>
  </div>
  <div id="legend-wrap">
    <span id="leg-lo">0</span>
    <div id="leg-bar" style="width:80px;height:8px;border-radius:3px;"></div>
    <span id="leg-hi">100%+</span>
  </div>
</div>
</div>

const TAX_BY_NAME=(()=>{
  const map={};
  Object.entries(TAX).forEach(([id,entry])=>{if(entry.n)map[entry.n]=id;});
  return map;
})();

// Helper to reliably find TAX entry from any country ID format
function getTAXEntry(id){
  let entry=TAX[String(id)];
  if(entry)return entry;
  // Try alpha-2 code mapping
  if(typeof id === 'string' && id.length === 2 && COUNTRY_CODE_MAP[id]){
    entry=TAX[COUNTRY_CODE_MAP[id]];
    if(entry)return entry;
  }
  return null;
}

function taxColor(val,maxVal){
  if(val==null) return isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.08)';
  const t=Math.min(val/maxVal,1);
  if(t<0.01) return isDark?'rgba(59,130,246,0.3)':'rgba(59,130,246,0.18)';
  const r=Math.round(59+(220-59)*t),g=Math.round(130+(38-130)*t),b=Math.round(246+(38-246)*t);
  return `rgba(${r},${g},${b},${isDark?0.3+0.65*t:0.2+0.75*t})`;
}
function passportColor(val){ // 0–192 visa-free countries; green scale
  if(val==null) return isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.08)';
  const t=Math.min(val/192,1);
  if(t<0.02) return isDark?'rgba(220,38,38,0.5)':'rgba(220,38,38,0.3)';
  const r=Math.round(220-(220-34)*t),g=Math.round(38+(197-38)*t),b=Math.round(38+(94-38)*t);
  return `rgba(${r},${g},${b},${isDark?0.25+0.7*t:0.2+0.75*t})`;
}
function weatherColor(wkey,val){
  if(val==null) return isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.08)';
  if(wkey==='sun'){
    const t=Math.min(val/350,1);
    const r=Math.round(255-(255-255)*t),g=Math.round(200+(165-200)*t),b=Math.round(50+(0-50)*t);
    return `rgba(${r},${g},${b},${0.15+0.8*t})`;
  }
  if(wkey==='rain'){
    const t=Math.min(val/350,1);
    const r=Math.round(200-(200-30)*t),g=Math.round(220-(220-100)*t),b=Math.round(255-(255-200)*t);
    return `rgba(${r},${g},${b},${0.15+0.8*t})`;
  }
  if(wkey==='temp'){
    const t=Math.min(Math.max((val+10)/50,0),1);
    const r=Math.round(59+(220-59)*t),g=Math.round(130+(38-130)*t),b=Math.round(246+(38-246)*t);
    return `rgba(${r},${g},${b},${0.15+0.8*t})`;
  }
  return 'rgba(128,128,128,0.3)';
}

function getCountryColor(name, numericId){
  if(mode==='tax'){
    const e=numericId!=null?TAX[String(numericId)]:null;
    const d=e||SMALL_DOTS.find(s=>s.n===name);
    return d?taxColor(d[taxKey],MAX_TAX[taxKey]):(isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.08)');
  }
  if(mode==='passport'){
    return passportColor(getVisa(name));
  }
  if(mode==='weather'){
    const w=getWeather(name);
    if(!w) return isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.08)';
    const arr=w[weatherKey];
    return weatherColor(weatherKey, arr?arr[monthIdx]:null);
  }
  return 'rgba(128,128,128,0.3)';
}

function getFilters(){
  const v=id=>{const el=document.getElementById(id);return el&&el.value!==''?parseFloat(el.value):null;};
  return{
    effMin:v('f-eff-min'),effMax:v('f-eff-max'),
    capMin:v('f-cap-min'),capMax:v('f-cap-max'),
    corMin:v('f-cor-min'),corMax:v('f-cor-max'),
    incMin:v('f-inc-min'),incMax:v('f-inc-max'),
    visaMin:v('f-visa-min'),visaMax:v('f-visa-max'),
    sunMin:v('f-sun-min'),sunMax:v('f-sun-max'),
    tempMin:v('f-temp-min'),tempMax:v('f-temp-max'),
  };
}

function passesFilter(e,f){
  if(mode==='tax'){
    if(f.effMin!=null&&e.effective<f.effMin)return false;
    if(f.effMax!=null&&e.effective>f.effMax)return false;
    if(f.capMin!=null&&e.capital<f.capMin)return false;
    if(f.capMax!=null&&e.capital>f.capMax)return false;
    if(f.corMin!=null&&e.corporate<f.corMin)return false;
    if(f.corMax!=null&&e.corporate>f.corMax)return false;
    if(f.incMin!=null&&e.income<f.incMin)return false;
    if(f.incMax!=null&&e.income>f.incMax)return false;
  } else if(mode==='passport'){
    const v=getVisa(e.n);
    if(f.visaMin!=null&&(v==null||v<f.visaMin))return false;
    if(f.visaMax!=null&&(v==null||v>f.visaMax))return false;
  } else if(mode==='weather'){
    const w=getWeather(e.n);
    if(w){
      const sunV=w.sun[monthIdx],tempV=Math.round((w.tmin[monthIdx]+w.tmax[monthIdx])/2);
      if(f.sunMin!=null&&sunV<f.sunMin)return false;
      if(f.sunMax!=null&&sunV>f.sunMax)return false;
      if(f.tempMin!=null&&tempV<f.tempMin)return false;
      if(f.tempMax!=null&&tempV>f.tempMax)return false;
    }
  }
  return true;
}

function getPrimaryVal(e){
  if(mode==='tax') return taxKey==='effective'?e.effective:taxKey==='capital'?e.capital:taxKey==='corporate'?e.corporate:e.income;
  if(mode==='passport') return getVisa(e.n)??0;
  if(mode==='weather'){const w=getWeather(e.n);if(!w)return 0;return weatherKey==='sun'?w.sun[monthIdx]:weatherKey==='rain'?w.rain[monthIdx]:Math.round((w.tmin[monthIdx]+w.tmax[monthIdx])/2);}
  return 0;
}

function getSorted(arr){
  return[...arr].sort((a,b)=>{
    if(sortKey==='name-asc') return a.n.localeCompare(b.n,'de');
    const av=getPrimaryVal(a),bv=getPrimaryVal(b);
    return sortKey==='primary-asc'?av-bv:bv-av;
  });
}

function getVisible(){
  const q=document.getElementById('search-input').value.trim().toLowerCase();
  const f=getFilters();
  let arr=allCountries;
  if(q) arr=arr.filter(e=>e.n.toLowerCase().includes(q));
  return getSorted(arr.filter(e=>passesFilter(e,f)));
}

const mapArea=document.getElementById('map-area');
const svg=d3.select('#map-svg');
const gCountries=svg.append('g').attr('class','g-countries');
const gDots=svg.append('g').attr('class','g-dots');
const tooltip=document.getElementById('tooltip');
const projection=d3.geoNaturalEarth1();
const pathGen=d3.geoPath(projection);

function updateProjection(){
  const r=mapArea.getBoundingClientRect();
  const w=r.width||432,h=r.height||620;
  projection.scale(w/4.8).translate([w/2,h/2]);
  document.getElementById('map-svg').setAttribute('viewBox',`0 0 ${w} ${h}`);
}

const zoom=d3.zoom().scaleExtent([1,8]).on('zoom',ev=>{
  gCountries.attr('transform',ev.transform);
  gDots.attr('transform',ev.transform);
});
svg.call(zoom);

function buildTooltip(name,numId){
  let e=numId!=null?TAX[String(numId)]:null;
  if(!e) e=SMALL_DOTS.find(s=>s.n===name);
  const isOECD=numId!=null&&OECD_IDS.has(String(numId));
  const w=getWeather(name);
  const visa=getVisa(name);

  let html=`<div style="font-weight:600;margin-bottom:6px;font-size:13px;color:var(--tx);">${name}</div>`;

  if(mode==='tax'&&e){
    const hi=k=>`style="color:${k===taxKey?'var(--tx-info)':'var(--tx)'};font-weight:${k===taxKey?600:400};"`;
    const note=isOECD?' <span style="font-size:9px;color:var(--tx3)">(OECD)</span>':'<span style="font-size:9px;color:var(--tx3)"> (Sch.)</span>';
    html+=`<div style="display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-size:11px;color:var(--tx2);">
      <span>Ø Effektiv${note}</span><span ${hi('effective')}>${e.effective}%</span>
      <span>Kapitalertrag</span><span ${hi('capital')}>${e.capital}%</span>
      <span>Körperschaft</span><span ${hi('corporate')}>${e.corporate}%</span>
      <span>Max. Einkommen</span><span ${hi('income')}>${e.income}%</span>
    </div>`;
  } else if(mode==='passport'){
    const pct=visa!=null?Math.round(visa/192*100):0;
    html+=`<div style="font-size:11px;color:var(--tx2);margin-bottom:6px;">
      Visa-freie Länder: <strong style="color:var(--tx-info);">${visa??'–'}</strong> von 192
    </div>
    <div style="height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;">
      <div style="width:${pct}%;height:6px;background:linear-gradient(90deg,#1976d2,#42a5f5);border-radius:3px;"></div>
    </div>`;
  } else if(mode==='weather'&&w){
    const tavg=Math.round((w.tmin[monthIdx]+w.tmax[monthIdx])/2);
    const sunYr=Math.round(w.sun.reduce((a,b)=>a+b,0));
    html+=`<div style="font-size:12px;font-weight:500;color:var(--tx2);margin-bottom:4px;">${MONTHS[monthIdx]}</div>
    <div style="display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-size:11px;color:var(--tx2);">
      <span>☀ Sonne</span><span style="color:#f59e0b;font-weight:600;">${w.sun[monthIdx]}h</span>
      <span>🌧 Regen</span><span style="color:#3b82f6;font-weight:500;">${w.rain[monthIdx]}mm</span>
      <span>🌡 Min/Max</span><span style="color:var(--tx);">${w.tmin[monthIdx]}° / ${w.tmax[monthIdx]}°C</span>
      <span>🌡 Ø Temp</span><span style="color:var(--tx);">${tavg}°C</span>
      <span>☀ Jahressumme</span><span style="color:#f59e0b;">${sunYr}h</span>
    </div>`;
  } else {
    html+=`<div style="font-size:11px;color:var(--tx3);">Keine Daten</div>`;
  }
  return html;
}

function showTooltip(ev,name,numId){
  tooltip.innerHTML=buildTooltip(name,numId);
  tooltip.style.display='block';
  const r=mapArea.getBoundingClientRect();
  const mx=ev.clientX-r.left,my=ev.clientY-r.top;
  tooltip.style.left=Math.min(mx+14,r.width-250)+'px';
  tooltip.style.top=Math.max(my-10,8)+'px';
}

function renderMap(highlightNames){
  const hasFilter=!!highlightNames;

  gCountries.selectAll('path.country').data(mapFeatures).join('path')
    .attr('class','country').attr('d',pathGen)
    .attr('stroke',isDark?'rgba(255,255,255,0.12)':'rgba(0,0,0,0.15)')
    .attr('stroke-width',isDark?0.5:0.4)
    .attr('fill',d=>{
      const e=getTAXEntry(d.id);
      const name=e?e.n:null;
      if(!name) return isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.07)';
      if(hasFilter&&!highlightNames.has(name)) return isDark?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)';
      return getCountryColor(name,d.id);
    })
    .attr('fill-opacity',d=>{
      if(!hasFilter) return 1;
      const e=getTAXEntry(d.id);
      return(!e||highlightNames.has(e.n))?1:0.12;
    })
    .style('cursor','pointer')
    .on('mousemove',function(ev,d){
      const e=getTAXEntry(d.id);
      if(!e){tooltip.style.display='none';return;}
      if(hasFilter&&!highlightNames.has(e.n)){tooltip.style.display='none';return;}
      showTooltip(ev,e.n,d.id);
    })
    .on('mouseleave',()=>{tooltip.style.display='none';});

  // Dots
  const dotData=SMALL_DOTS.map(s=>{
    const proj=projection([s.lon,s.lat]);
    return proj?{...s,px:proj[0],py:proj[1]}:null;
  }).filter(Boolean);

  gDots.selectAll('g.sdot').data(dotData,d=>d.n).join(
    enter=>{
      const gg=enter.append('g').attr('class','sdot').style('cursor','pointer');
      gg.append('circle').attr('class','dot-outer').attr('r',3.5).attr('fill','none').attr('stroke-width',1.2);
      gg.append('circle').attr('class','dot-inner').attr('r',2.2);
      gg.on('mousemove',function(ev,d){
        if(hasFilter&&!highlightNames.has(d.n)){tooltip.style.display='none';return;}
        showTooltip(ev,d.n,null);
      }).on('mouseleave',()=>{tooltip.style.display='none';});
      return gg;
    },update=>update
  )
  .attr('transform',d=>`translate(${d.px},${d.py})`)
  .attr('opacity',d=>{if(!hasFilter)return 1;return highlightNames.has(d.n)?1:0.15;})
  .each(function(d){
    d3.select(this).select('.dot-inner').attr('fill',getCountryColor(d.n,null));
    d3.select(this).select('.dot-outer').attr('stroke',isDark?'rgba(255,255,255,0.6)':'rgba(0,0,0,0.35)');
  });
}

function switchMode(m){

    subBar.style.display='flex';
    subBar.innerHTML=`
      <button class="sub-btn${taxKey==='effective'?' active':''}" data-key="effective">Ø Effektiv</button>

      <button class="sub-btn${taxKey==='corporate'?' active':''}" data-key="corporate">Körper.</button>
      <button class="sub-btn${taxKey==='income'?' active':''}" data-key="income">Max.Eink.</button>`;
    subBar.querySelectorAll('.sub-btn').forEach(b=>b.addEventListener('click',function(){
      taxKey=this.dataset.key;
      subBar.querySelectorAll('.sub-btn').forEach(x=>x.classList.remove('active'));
      this.classList.add('active');
      updateLegend();refresh();

  } else if(m==='passport'){
    subBar.style.display='none';
  } else {
    subBar.style.display='none';
  }

  // weather ctrl
  const wc=document.getElementById('weather-ctrl');
  wc.classList.toggle('visible',m==='weather');

  document.getElementById('filter-toggle').textContent=
    (document.getElementById('filter-body').classList.contains('open')?'▾':'▸')+
    (m==='tax'?' Steuer-Filter':m==='passport'?' Pass-Filter':' Wetter-Filter');

  buildFilterUI();
  updateLegend();
  refresh();
}

document.getElementById('filter-toggle').addEventListener('click',function(){
  const fb=document.getElementById('filter-body');
  const open=fb.classList.toggle('open');
  const label=mode==='tax'?' Steuer-Filter':mode==='passport'?' Pass-Filter':' Wetter-Filter';
  this.textContent=(open?'▾':'▸')+label;
});

// Search
document.getElementById('search-input').addEventListener('input',refresh);

// Month slider
document.getElementById('month-slider').addEventListener('input',function(){
  monthIdx=parseInt(this.value);
  document.getElementById('month-label').textContent=MONTHS[monthIdx];
  updateLegend();
  refresh();
});

// Weather sub-tabs
document.querySelectorAll('.wc-tab').forEach(btn=>{
  btn.addEventListener('click',function(){
    weatherKey=this.dataset.wkey;
    document.querySelectorAll('.wc-tab').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    updateLegend();refresh();
  });
});

// Zoom
document.getElementById('zoom-in').addEventListener('click',()=>svg.transition().duration(300).call(zoom.scaleBy,1.6));
document.getElementById('zoom-out').addEventListener('click',()=>svg.transition().duration(300).call(zoom.scaleBy,0.625));
document.getElementById('zoom-reset').addEventListener('click',()=>svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity));
document.getElementById('dark-toggle').addEventListener('click',()=>{
  isDark=!isDark;applyDark();
  document.getElementById('dark-toggle').textContent=isDark?'◑':'◐';
  refresh();
});
</script>
</body>
</html>
